[appearance]
spacing = "compact"

[appearance.tabs]
tab_close_button_position = "right"
workspace_decoration_visibility = "on_hover"

[appearance.vertical_tabs]
enabled = true
view_mode = "compact"
display_granularity = "tabs"
compact_subtitle = "branch"

[appearance.text]
font_name = "Hack"
notebook_font_size = 14.0
font_weight = "normal"
match_ai_font = true
font_size = 14.0
ai_font_name = "Hack"

[appearance.panes]
should_dim_inactive_panes = false
focus_pane_on_hover = false

[appearance.window]
open_windows_at_custom_size = false
zoom_level = 90
override_blur = 1
override_opacity = 100

[appearance.themes]
selected_system_themes = { dark = "gruvbox_dark", light = "light" }
theme = "snowy"
system_theme = true

[appearance.input]
input_mode = "pinned_to_bottom"

[appearance.cursor]
cursor_display_type = "block"

[appearance.icon]
app_icon = "original"

[agents]
cloud_conversation_storage_enabled = true

[agents.warp_agent]

[agents.warp_agent.input]
ai_auto_detection_enabled = true
nld_in_terminal_enabled = true

[agents.warp_agent.other]
cloud_agent_computer_use_enabled = false
should_render_use_agent_toolbar_for_user_commands = false

[agents.execution_profiles]

[agents.execution_profiles.default]
apply_code_diffs = "agent_decides"
ask_user_question = "always_ask"
autosync_plans_to_warp_drive = true
base_model = "58306a83-f2ba-47a9-950c-1b9becdf12e0"
command_allowlist = []
command_denylist = [
  'bash(\s.*)?',
  'fish(\s.*)?',
  'pwsh(\s.*)?',
  'sh(\s.*)?',
  'zsh(\s.*)?',
  'curl(\s.*)?',
  'eval(\s.*)?',
  'exec(\s.*)?',
  'source(\s.*)?',
  'wget(\s.*)?',
  'dig(\s.*)?',
  'nslookup(\s.*)?',
  'host(\s.*)?',
  'ssh(\s.*)?',
  'scp(\s.*)?',
  'rsync(\s.*)?',
  'telnet(\s.*)?',
  'rm(\s.*)?',
]
computer_use = "never"
directory_allowlist = []
execute_commands = "always_ask"
mcp_allowlist = []
mcp_denylist = []
mcp_permissions = "agent_decides"
name = "Default"
read_files = "agent_decides"
run_agents = "always_ask"
web_search_enabled = true
write_to_pty = "always_allow"

[terminal]
osc52_clipboard_access = "write_only"

[terminal.input]
input_box_type_setting = "universal"

[terminal.input.extra_meta_keys]
left_alt = true
right_alt = false

[account]
is_settings_sync_enabled = true

[privacy]
telemetry_enabled = true
crash_reporting_enabled = true

[notifications]
toast_duration_secs = 8

[notifications.preferences]
is_agent_task_completed_enabled = true
is_long_running_enabled = true
is_needs_attention_enabled = true
is_password_prompt_enabled = true
long_running_threshold = 30
mode = "enabled"
play_notification_sound = true

[code]

[code.editor]
open_file_layout = "new_tab"

[workflows]
show_global_workflows_in_universal_search = false

[general]
show_warning_before_quitting = false

[cloud_platform]

[cloud_platform.third_party_api_keys]
can_use_warp_credits_with_byok = true
